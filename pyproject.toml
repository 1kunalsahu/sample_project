[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "criticrag"
version = "0.1.0"
description = "Controlled evaluation of critic verification for retrieval-augmented generation"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
retrieval = ["sentence-transformers>=3.0", "torch>=2.2"]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["ingestion*", "retrieval*", "generation*", "critic*", "pipeline*", "evaluation*", "experiments*"]
